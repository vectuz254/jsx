<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CTA + Footer Section</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          heading: ["'Instrument Serif'", "serif"],
          body: ["'Barlow'", "sans-serif"],
        },
      },
    },
  };
</script>

<!-- hls.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>

<style>
  body {
    font-family: 'Barlow', sans-serif;
    background: #000;
    color: #fff;
  }
  h1, h2, h3 {
    font-family: 'Instrument Serif', serif;
  }

  .liquid-glass-strong {
    background: rgba(255, 255, 255, 0.01);
    background-blend-mode: luminosity;
    backdrop-filter: blur(50px);
    -webkit-backdrop-filter: blur(50px);
    border: none;
    box-shadow: 4px 4px 4px rgba(0, 0, 0, 0.05),
      inset 0 1px 1px rgba(255, 255, 255, 0.15);
    position: relative;
    overflow: hidden;
  }

  .liquid-glass-strong::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.4px;
    background: linear-gradient(
      180deg,
      rgba(255, 255, 255, 0.5) 0%,
      rgba(255, 255, 255, 0.2) 20%,
      rgba(255, 255, 255, 0) 40%,
      rgba(255, 255, 255, 0) 60%,
      rgba(255, 255, 255, 0.2) 80%,
      rgba(255, 255, 255, 0.5) 100%
    );
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
</style>
</head>
<body class="bg-black">

<section class="relative py-32 px-6 md:px-16 lg:px-24 text-center overflow-hidden">

  <!-- Background HLS Video -->
  <video
    id="cta-video"
    autoplay
    loop
    muted
    playsinline
    class="absolute inset-0 w-full h-full object-cover z-0"
  ></video>

  <!-- Top fade -->
  <div
    class="absolute top-0 left-0 right-0 z-[1] pointer-events-none"
    style="height: 200px; background: linear-gradient(to bottom, black, transparent);"
  ></div>
  <!-- Bottom fade -->
  <div
    class="absolute bottom-0 left-0 right-0 z-[1] pointer-events-none"
    style="height: 200px; background: linear-gradient(to top, black, transparent);"
  ></div>

  <!-- Content -->
  <div class="relative z-10">
    <h2 class="text-5xl md:text-6xl lg:text-7xl font-heading italic text-white tracking-tight leading-[0.85] max-w-3xl mx-auto mb-4">
      Your next website starts here.
    </h2>
    <p class="text-white/60 font-body font-light text-sm md:text-base max-w-xl mx-auto mb-8">
      Book a free strategy call. See what AI&#8209;powered design can do. No commitment, no pressure. Just possibilities.
    </p>
    <div class="flex items-center justify-center gap-6">
      <button class="liquid-glass-strong rounded-full px-6 py-3 text-sm font-medium text-white flex items-center gap-2 hover:bg-white/10 transition-all font-body">
        Book a Call
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 17L17 7"></path><path d="M7 7h10v10"></path>
        </svg>
      </button>
      <button class="bg-white text-black rounded-full px-6 py-3 text-sm font-medium flex items-center gap-2 hover:bg-white/90 transition-colors font-body">
        View Pricing
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 17L17 7"></path><path d="M7 7h10v10"></path>
        </svg>
      </button>
    </div>

    <!-- Footer -->
    <div class="mt-32 pt-8 border-t border-white/10 flex flex-col md:flex-row items-center justify-between gap-4">
      <p class="text-white/40 font-body font-light text-xs">
        &copy; 2026 Studio. All rights reserved.
      </p>
      <div class="flex items-center gap-6">
        <a href="#" class="text-white/40 hover:text-white/70 font-body font-light text-xs transition-colors">Privacy</a>
        <a href="#" class="text-white/40 hover:text-white/70 font-body font-light text-xs transition-colors">Terms</a>
        <a href="#" class="text-white/40 hover:text-white/70 font-body font-light text-xs transition-colors">Contact</a>
      </div>
    </div>
  </div>
</section>

<script>
  (function () {
    var video = document.getElementById('cta-video');
    var src = 'https://stream.mux.com/8wrHPCX2dC3msyYU9ObwqNdm00u3ViXvOSHUMRYSEe5Q.m3u8';

    if (window.Hls && Hls.isSupported()) {
      var hls = new Hls();
      hls.loadSource(src);
      hls.attachMedia(video);
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // Safari native HLS
      video.src = src;
    }
  })();
</script>

</body>
</html>
